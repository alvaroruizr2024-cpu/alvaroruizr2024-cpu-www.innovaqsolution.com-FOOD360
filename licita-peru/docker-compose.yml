# Entorno completo en una máquina: base de datos + aplicación.
# Uso: copie .env.example a .env, complete ANTHROPIC_API_KEY y ejecute `docker compose up --build`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: licita
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambie-esta-clave}
      POSTGRES_DB: licita
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licita -d licita"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://licita:${POSTGRES_PASSWORD:-cambie-esta-clave}@db:5432/licita
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
    ports:
      - "3000:3000"
    volumes:
      - archivos:/data

volumes:
  db:
  archivos:
